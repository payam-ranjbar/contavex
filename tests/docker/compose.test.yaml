# The Docker smoke test: the real image, hardened exactly like compose.yaml,
# with a fake Telegram and a consumer as separate containers.
# FIXTURES and TESTS_DIR are set by tests/docker/test_docker.py.
name: contavex-smoke

services:
  publisher:
    image: contavex:test
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - smoke-data:/data
      - ${FIXTURES}/contavex.toml:/config/contavex.toml:ro
    secrets:
      - consumer_api_key_demo
      - telegram_news_bot_token
    networks:
      - contavex
    depends_on:
      - fake-telegram

  fake-telegram:
    image: contavex:test
    entrypoint: ["python", "/fake/fake_telegram_server.py", "8443"]
    healthcheck:  # replaces the image's own, which probes the publishing service
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8443), 2)"]
      interval: 2s
      retries: 10
    volumes:
      - ${TESTS_DIR}:/fake:ro
    networks:
      - contavex

  consumer:
    image: contavex:test
    profiles: ["tools"]
    entrypoint: ["python", "/consumer/consumer.py"]
    healthcheck:
      disable: true  # the image's health check is for the service itself
    volumes:
      - ${TESTS_DIR}:/consumer:ro
    secrets:
      - consumer_api_key_demo  # its own key only; no vendor credential
    networks:
      - contavex

networks:
  contavex:

volumes:
  smoke-data:

secrets:
  consumer_api_key_demo:
    file: ${FIXTURES}/secrets/consumer_api_key_demo
  telegram_news_bot_token:
    file: ${FIXTURES}/secrets/telegram_news_bot_token
