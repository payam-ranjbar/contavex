# Consumers reach the service at http://publisher:8080 on the "contavex"
# network. No host port is published here; see compose.dev.yaml for local use.
name: contavex

services:
  publisher:
    build: .
    image: contavex:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAVEX_LOG_LEVEL: INFO
    volumes:
      - contavex-data:/data
      - ./config/contavex.toml:/config/contavex.toml:ro
    # One entry per secret named in config/contavex.toml. Each is mounted
    # read-only at /run/secrets/<name> and never enters the environment.
    secrets:
      - consumer_api_key_demo
      - telegram_news_bot_token
      # - master_key
      # - instagram_brand_access_token
      # - s3_access_key_id
      # - s3_secret_access_key
      # - linkedin_founder_access_token
      # - linkedin_client_id
      # - linkedin_client_secret
    networks:
      - contavex
    expose:
      - "8080"
    # Only for the "self-hosted" staging strategy: the public media listener.
    # Bind it to loopback and put an HTTPS reverse proxy in front of it.
    # ports:
    #   - "127.0.0.1:8081:8081"

networks:
  contavex:
    name: contavex

volumes:
  # Publication history, uploaded media and encrypted tokens. Back it up; do
  # not bind-mount it from a Windows path (SQLite needs real file locking).
  contavex-data:

secrets:
  consumer_api_key_demo:
    file: ./secrets/consumer_api_key_demo
  telegram_news_bot_token:
    file: ./secrets/telegram_news_bot_token
  # master_key:
  #   file: ./secrets/master_key
  # instagram_brand_access_token:
  #   file: ./secrets/instagram_brand_access_token
  # s3_access_key_id:
  #   file: ./secrets/s3_access_key_id
  # s3_secret_access_key:
  #   file: ./secrets/s3_secret_access_key
  # linkedin_founder_access_token:
  #   file: ./secrets/linkedin_founder_access_token
  # linkedin_client_id:
  #   file: ./secrets/linkedin_client_id
  # linkedin_client_secret:
  #   file: ./secrets/linkedin_client_secret
