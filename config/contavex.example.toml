# [accounts.brand-instagram]
# platform = "instagram"
# implementation = "instagram-login"
# # The long-lived token from the Meta App Dashboard. The service refreshes it.
# credentials = { access_token = "instagram_brand_access_token" }
# # The professional account's id: the `user_id` returned by GET /me.
# settings = { ig_user_id = "17841400000000000" }

# --- LinkedIn ---------------------------------------------------------------

# A personal profile. Without a refresh token the access token must be
# replaced by hand about every 60 days; with client_id/client_secret the
# service at least reports the date in GET /v1/accounts.
# [accounts.founder-linkedin]
# platform = "linkedin"
# implementation = "rest"
# settings = { author = "urn:li:person:REPLACE" }
# [accounts.founder-linkedin.credentials]
# access_token = "linkedin_founder_access_token"
# client_id = "linkedin_client_id"
# client_secret = "linkedin_client_secret"

# A company Page (needs LinkedIn's Community Management API product).
# [accounts.company-linkedin]
# platform = "linkedin"
# implementation = "rest"
# settings = { author = "urn:li:organization:REPLACE" }
# [accounts.company-linkedin.credentials]
# access_token = "linkedin_company_access_token"
# refresh_token = "linkedin_company_refresh_token"   # only if LinkedIn issued one
# client_id = "linkedin_client_id"
# client_secret = "linkedin_client_secret"
