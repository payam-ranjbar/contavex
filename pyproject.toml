[project]
name = "content-fleet"
version = "0.1.0"
description = "Dockerized service for publishing content to social platforms behind one contract"
readme = "README.md"
requires-python = ">=3.14"
# Exact pins; rationale for each is in docs/DEPENDENCIES.md.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "httpx2==2.13.1",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not docker and not live'"
markers = [
    "unit: pure logic, no I/O beyond a temp directory",
    "integration: a provider implementation against a faked HTTP transport",
    "contract: one behavioural suite run against every provider implementation",
    "docker: builds and runs containers; needs a Docker daemon (opt-in: -m docker)",
    "live: calls real vendor APIs with real credentials (opt-in: -m live and CF_LIVE_TESTS=1)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
